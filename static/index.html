<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>RO/EDI 순수 운영점검일지</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <!-- Network Status & Offline Sync Bar (Always Visible) -->
    <div id="network-status-bar" class="network-status-bar online">
        <div class="network-info">
            <span id="network-icon">📶</span>
            <span id="network-text">온라인 상태 (서버 실시간 저장 가능)</span>
        </div>
        <div class="network-actions">
            <button id="btn-sync-offline-queue" class="btn-sync-queue" onclick="syncOfflineQueue()" style="display: none;">
                🔄 대기 중인 <strong id="offline-queue-count">0</strong>개 일지 서버 동기화
            </button>
        </div>
    </div>

    <!-- Main Application Header with Inline Login in Yellow Area -->
    <header class="top-header">
        <div class="header-container">
            <div class="brand">
                <span class="logo-icon">💧</span>
                <div class="brand-text">
                    <h1>RO/EDI 순수 운영점검일지</h1>
                    <span class="sub-title">B동·C동·D동·E동 현장 점검 시스템 (음영지역 오프라인 작성 지원)</span>
                </div>
            </div>

            <!-- Header Inline Login Area (Yellow Box Location) -->
            <div id="header-login-area" class="header-login-box">
                <form id="header-login-form" onsubmit="handleInlineLoginSubmit(event)" class="inline-login-form">
                    <input type="text" id="inline-login-id" placeholder="아이디" required autocomplete="username">
                    <input type="password" id="inline-login-pw" placeholder="비밀번호" required autocomplete="current-password">
                    <button type="submit" class="btn-header-login">로그인</button>
                </form>
                <div id="inline-login-error" class="inline-login-error"></div>
            </div>

            <!-- Header User Info & Logout (Visible when logged in) -->
            <div id="header-user-area" class="header-user-box" style="display: none;">
                <span class="user-badge">👤 로그인됨 (1234)</span>
                <button class="btn-logout" onclick="handleLogout()">로그아웃</button>
            </div>
            
            <div class="header-actions">
                <div class="view-mode-toggle">
                    <button id="btn-mode-form" class="mode-btn active" onclick="switchViewMode('form')">
                        📝 점검 작성
                    </button>
                    <button id="btn-mode-dashboard" class="mode-btn" onclick="switchViewMode('dashboard')">
                        📈 트렌드 & 히스토리
                    </button>
                </div>
            </div>
        </div>

        <!-- Building Tab Bar (Always Visible) -->
        <nav class="building-tabs-scroll">
            <div class="building-tabs" id="building-tabs">
                <!-- Dynamically populated -->
            </div>
        </nav>
    </header>

    <main class="main-content">
        <!-- Auth Required Notice (Shown when logged out) -->
        <div id="auth-lock-banner" class="auth-lock-card">
            <div class="lock-icon">🔐</div>
            <h3>로그인이 필요합니다</h3>
            <p>상단 헤더의 로그인 영역에서 아이디와 비밀번호를 입력해 주세요.</p>
        </div>

        <!-- Authenticated View Container -->
        <div id="auth-content-area" style="display: none;">
            <!-- VIEW 1: 점검 작성 Web Form -->
            <section id="view-form" class="view-section active">
                <form id="inspection-form" onsubmit="handleFormSubmit(event)">
                    <div class="meta-card">
                        <div class="meta-row">
                            <div class="meta-group">
                                <label for="input-date">📅 점검 일자</label>
                                <input type="date" id="input-date" required>
                            </div>
                            <div class="meta-group">
                                <label for="input-inspector">👤 점검자</label>
                                <input type="text" id="input-inspector" placeholder="성명 입력 (예: 홍길동)" required>
                            </div>
                            <div class="meta-group meta-btn-group">
                                <button type="button" class="btn-copy-prev" onclick="copyPreviousLog()">
                                    📋 이전 점검 값 불러오기
                                </button>
                            </div>
                        </div>
                    </div>

                    <!-- Multi-Column Grid Form Fields Container -->
                    <div id="form-fields-container">
                        <!-- Dynamic Content -->
                    </div>

                    <div class="notes-card">
                        <label for="input-notes">📝 특이사항 및 비고</label>
                        <textarea id="input-notes" rows="2" placeholder="특이사항이나 장비 이상/교체 메모를 작성하세요..."></textarea>
                    </div>

                    <div class="submit-bar">
                        <button type="submit" class="btn-submit">
                            💾 점검일지 저장하기
                        </button>
                    </div>
                </form>
            </section>

            <!-- VIEW 2: 트렌드 차트 & 히스토리 데이터 관리 -->
            <section id="view-dashboard" class="view-section">
                <!-- Global Date Range Filter Bar -->
                <div class="dashboard-card filter-card">
                    <div class="global-filter-row">
                        <div class="filter-group">
                            <label for="filter-start-date">📅 조회 시작일:</label>
                            <input type="date" id="filter-start-date" onchange="onGlobalFilterChange()">
                        </div>
                        <div class="filter-group">
                            <label for="filter-end-date">📅 조회 종료일:</label>
                            <input type="date" id="filter-end-date" onchange="onGlobalFilterChange()">
                        </div>
                        <div class="filter-actions">
                            <button type="button" class="btn-reset" onclick="resetFilters()">
                                🔄 전체보기 (초기화)
                            </button>
                            <button type="button" class="btn-excel-export" onclick="exportExcel()">
                                📥 선택 기간 엑셀 내보내기 (.csv)
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Trend Chart Card -->
                <div class="dashboard-card trend-card">
                    <div class="card-header">
                        <h2>📈 점검 항목별 기간 트렌드 분석</h2>
                        <div class="chart-controls">
                            <label for="select-trend-field">분석 항목 선택:</label>
                            <select id="select-trend-field" onchange="renderTrendChart()"></select>
                        </div>
                    </div>
                    <div class="chart-wrapper">
                        <canvas id="trendChart"></canvas>
                    </div>
                </div>

                <!-- History Logs Table Card -->
                <div class="dashboard-card history-card">
                    <div class="card-header">
                        <h2>📋 점검 기록 히스토리 목록</h2>
                    </div>

                    <div class="table-responsive">
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>점검일자</th>
                                    <th>구분 / 라인</th>
                                    <th>점검자</th>
                                    <th>주요 수치 요약</th>
                                    <th>비고</th>
                                    <th>관리</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody">
                                <!-- Dynamic history rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <!-- Detail Modal -->
    <div id="modal-container" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-title">점검 기록 상세보기</h3>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Dynamic Content -->
            </div>
            <div class="modal-footer" id="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">닫기</button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="toast">저장되었습니다</div>

    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js').catch(err => {
                    console.log('SW Registration failed: ', err);
                });
            });
        }
    </script>
</body>
</html>
